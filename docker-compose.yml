services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elainsuoja
      POSTGRES_PASSWORD: elainsuoja
      POSTGRES_DB: elainsuoja
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elainsuoja"]
      interval: 5s
      retries: 10

  server-b:
    build: ./server-b
    environment:
      PORT: 3002
      DATABASE_URL: postgres://elainsuoja:elainsuoja@db:5432/elainsuoja
    ports:
      - "3002:3002"   # vain testausta varten
    depends_on:
      db:
        condition: service_healthy

  server-a:
    build: ./server-a
    environment:
      PORT: 3001
      DATABASE_URL: postgres://elainsuoja:elainsuoja@db:5432/elainsuoja
      ADOPTION_SERVICE_URL: http://server-b:3002
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      server-b:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - server-a

volumes:
  db-data:
