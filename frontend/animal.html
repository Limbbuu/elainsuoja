<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tutustu adoptoitavaan eläimeen ja lähetä adoptiohakemus Vaasan Eläinsuojalle.">
    <title>Eläimen tiedot | Vaasan Eläinsuoja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h1>Vaasan Eläinsuoja</h1>
            <a href="index.html">Etusivu</a>
        </nav>
    </header>

    <main class="animal-page">

        <a href="index.html" class="back-link">← Takaisin eläimiin</a>

        <!-- Eläimen tiedot tulevat tähän JavaScriptin kautta -->
        <section id="animal-details" class="animal-details">
            <p>Ladataan eläimen tietoja...</p>
        </section>

        <!-- Adoptiohakemus -->
        <section id="adoption-section" class="adoption-section" hidden>

            <h2>Haluaisitko antaa minulle kodin?</h2>

            <p>
                Täytä alla oleva hakemus, niin Vaasan Eläinsuoja
                käsittelee adoptiohakemuksesi.
            </p>

            <form id="adoption-form">

                <div class="form-group">
                    <label for="applicant_name">Koko nimi *</label>
                    <input
                        type="text"
                        id="applicant_name"
                        name="applicant_name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Sähköposti *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Puhelinnumero</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        autocomplete="tel"
                    >
                </div>

                <div class="form-group">
                    <label for="message">Kerro hieman itsestäsi</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Miksi haluaisit adoptoida tämän eläimen?"
                    ></textarea>
                </div>

                <button type="submit" class="btn" id="submit-btn">
                    Adoptoi minut
                </button>

                <p id="form-error" class="form-error" role="alert" hidden></p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Vaasan Eläinsuoja ry</p>
    </footer>

    <script src="animal.js"></script>
</body>
</html>
